# Single source of truth for Trace application versioning.
#
# versionName = MAJOR.MINOR.PATCH locally, or "MAJOR.MINOR.PATCH (build N)" in CI.
# versionCode = buildNumber + VERSION_CODE_OFFSET (where buildNumber is passed via -PbuildNumber
# in CI from github.run_number, or defaults to 1 for local builds).
#
# IMPORTANT: Android requires versionCode to strictly increase for every update installed over an
# existing build. VERSION_CODE_OFFSET exists so that if the GitHub Actions workflow is ever
# recreated and github.run_number resets to 1, VERSION_CODE_OFFSET can be raised above the last
# published versionCode so new builds continue to have strictly higher versionCodes.
VERSION_MAJOR=1
VERSION_MINOR=1
VERSION_PATCH=0
VERSION_CODE_OFFSET=100
